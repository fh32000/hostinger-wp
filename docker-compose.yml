services:
  db:
    image: mariadb:10.11
    container_name: tajalhdaya_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: tajalhdaya
      MYSQL_USER: tajalhdaya_user
      MYSQL_PASSWORD: tajalhdaya_password
    volumes:
      - db_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "33068:3306"
    networks:
      - tajalhdaya_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: tajalhdaya_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_password
      UPLOAD_LIMIT: 256M
    ports:
      - "8086:80"
    depends_on:
      - db
    networks:
      - tajalhdaya_net

  web:
    image: wordpress:6.7.1-php8.2-apache
    container_name: tajalhdaya_web
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: tajalhdaya
      WORDPRESS_DB_USER: tajalhdaya_user
      WORDPRESS_DB_PASSWORD: tajalhdaya_password
    volumes:
      - ./sites/tajalhdaya.roseise.com:/var/www/html
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      - db
    networks:
      - tajalhdaya_net

volumes:
  db_data:

networks:
  tajalhdaya_net:
    driver: bridge

